[project]
name = "mla"
version = "0.1.0"
description = "Multilevel analysis of GenAI exposure and political trust (KU Leuven 2026)"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "scipy>=1.13",
    "pyreadstat>=1.2.7",
    "pyreadr>=0.5.0",
    "statsmodels>=0.14.2",
    "linearmodels>=6.0",
    "matplotlib>=3.8",
    "seaborn>=0.13",
    "stargazer>=0.0.7",
    "python-dotenv>=1.0",
    "requests>=2.32",
    "pyarrow>=16.0",
    "openpyxl>=3.1",
    "tqdm>=4.66",
    "jupyter>=1.0",
    "ipykernel>=6.29",
    "nbmake>=1.5",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
]
# Optional R-backed mixed-model bridge for Kenward-Roger SE checks.
# Requires a working R installation with lme4 and lmerTest.
pymer4 = [
    "pymer4>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mla"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
